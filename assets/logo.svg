<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 668 200" width="668" height="200" role="img" aria-label="My Little Agent">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- mascot: a little octopus, one tentacle per agent -->
  <g>
    <!-- side fins -->
    <ellipse cx="50" cy="88" rx="12" ry="17" fill="url(#g)" opacity="0.55" transform="rotate(-18 50 88)"/>
    <ellipse cx="150" cy="88" rx="12" ry="17" fill="url(#g)" opacity="0.55" transform="rotate(18 150 88)"/>
    <!-- body + tentacles -->
    <path fill="url(#g)"
          d="M54,100 A46,46 0 0 1 146,100 V118 a11.5,14 0 0 1 -23,0 a11.5,14 0 0 1 -23,0 a11.5,14 0 0 1 -23,0 a11.5,14 0 0 1 -23,0 Z"/>
    <!-- face -->
    <circle cx="84" cy="96" r="11" fill="#FFFFFF"/>
    <circle cx="116" cy="96" r="11" fill="#FFFFFF"/>
    <circle cx="86" cy="98" r="5.5" fill="#1E293B"/>
    <circle cx="118" cy="98" r="5.5" fill="#1E293B"/>
    <circle cx="83.5" cy="94.5" r="2" fill="#FFFFFF"/>
    <circle cx="115.5" cy="94.5" r="2" fill="#FFFFFF"/>
    <path d="M93,112 q7,7 14,0" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="68" cy="110" r="6" fill="#F472B6" opacity="0.45"/>
    <circle cx="132" cy="110" r="6" fill="#F472B6" opacity="0.45"/>
  </g>

  <text x="206" y="106" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="54" font-weight="700" letter-spacing="-1.5" fill="url(#g)">my little agent</text>
  <text x="208" y="140" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="500" letter-spacing="0.5" fill="#94A3B8">multi-agent framework for Chrome Built-in AI</text>
</svg>
